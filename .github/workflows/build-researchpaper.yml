name: Build research paper

on:
  push:
    branches:
      - main
      - closure/maveb-final-layout-20260921
    paths:
      - 'researchpaper/**'
      - '.github/workflows/build-researchpaper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers texlive-pictures texlive-bibtex-extra pandoc zip

      - name: Verify exact Figure 2 asset
        run: |
          test -f researchpaper/figures/figure2_exact.png
          echo "e8cfa3b68930c9052c7fbe4190eb7841efb428ab1bfe587e03dbea9fac0d1f24  researchpaper/figures/figure2_exact.png" | sha256sum -c -

      - name: Compile PDF
        working-directory: researchpaper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          cp main.pdf MAVEB_manuscript.pdf

      - name: Export Word manuscript
        working-directory: researchpaper
        run: |
          pandoc main.tex --bibliography=references.bib --citeproc -s -o MAVEB_manuscript.docx || true
          test -f MAVEB_manuscript.docx

      - name: Package manuscript
        run: |
          rm -f researchpaper/MAVEB_manuscript_package.zip
          zip -r researchpaper/MAVEB_manuscript_package.zip researchpaper/main.tex researchpaper/references.bib researchpaper/README.md researchpaper/REVIEW_RESPONSE_2026-09-21.md researchpaper/supplement_gaussian_bound.tex researchpaper/figures researchpaper/MAVEB_manuscript.pdf researchpaper/MAVEB_manuscript.docx

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add researchpaper/MAVEB_manuscript.pdf researchpaper/MAVEB_manuscript.docx researchpaper/MAVEB_manuscript_package.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build final MAVEB manuscript artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}