name: Swift Format Autofix

on:
  push:
    branches:
      - polish/v0.1-studio-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/v0.1-studio-ui
      - name: Apply repository Swift formatting
        run: |
          set -euo pipefail
          xcrun swift-format format --in-place \
            apps/AetherStudio/Sources/AetherStudioApp.swift \
            apps/AetherStudio/Sources/ContentView.swift \
            apps/AetherStudio/Sources/ReconstructionWorkspace.swift \
            apps/MavebCapture/Sources/CaptureView.swift
          xcrun swift-format lint --strict \
            apps/AetherStudio/Sources/AetherStudioApp.swift \
            apps/AetherStudio/Sources/ContentView.swift \
            apps/AetherStudio/Sources/ReconstructionWorkspace.swift \
            apps/MavebCapture/Sources/CaptureView.swift
      - name: Commit formatted sources
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/AetherStudio/Sources/AetherStudioApp.swift \
                  apps/AetherStudio/Sources/ContentView.swift \
                  apps/AetherStudio/Sources/ReconstructionWorkspace.swift \
                  apps/MavebCapture/Sources/CaptureView.swift
          git commit -m "Apply swift-format to v0.1 UI"
          git push origin HEAD:polish/v0.1-studio-ui
