name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: CPU Build + Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci

  benchmark-python-tests:
    name: MavebBench Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MavebBench Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check numpy pillow scipy
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: MavebBench unit tests
        run: python3 -m unittest discover -s benchmarks/tests -p 'test_*.py'
      - name: Research evaluation unit tests
        run: python3 -m unittest discover -s research/tests -p 'test_*.py'
      - name: Resampling-lineage research probe
        run: >-
          python3 research/probes/resampling_lineage_probe.py
          --self-test
          --output build/research-ci/resampling-lineage-v1.json

  sanitizer:
    name: Sanitizer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset sanitizer
      - name: Build
        run: cmake --build --preset sanitizer --parallel
      - name: Test
        run: ctest --test-dir build/sanitizer --output-on-failure

  ipad-capture:
    name: iPad Capture Compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure iPad application
        run: >-
          cmake -S apps/MavebCapture -B build/ipad-capture -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0
      - name: Build without signing
        run: >-
          cmake --build build/ipad-capture --config Debug --
          -sdk iphoneos CODE_SIGNING_ALLOWED=NO

  format:
    name: Format/Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace and source formatting
        shell: bash
        run: |
          set -euo pipefail
          bash -n run_all.sh bootstrap_and_run.sh run_real_campaign.sh capture_to_real_campaign.sh run_public_real_campaign.sh run_public_real_campaign_v2.sh run_trained_3dgs_campaign.sh run_broad_benchmark_campaign.sh run_paper_grade_research.sh run_reviewer_stress_campaign.sh cleanup_maveb_storage.sh
          zsh -n tools/build-colmap-macos.zsh
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="HEAD^"
            fi
          fi
          git diff --check "$base" HEAD
          cpp_files=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && cpp_files+=("$file")
          done < <(git diff --diff-filter=ACMR --name-only "$base" HEAD -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')
          if (( ${#cpp_files[@]} )); then
            "$(brew --prefix llvm@18)/bin/clang-format" --dry-run --Werror "${cpp_files[@]}"
          fi
          swift_files=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && swift_files+=("$file")
          done < <(git diff --diff-filter=ACMR --name-only "$base" HEAD -- '*.swift')
          if (( ${#swift_files[@]} )); then
            xcrun swift-format lint --strict "${swift_files[@]}"
          fi

  static-analysis:
    name: Changed-files Static Analysis
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure compile database
        run: cmake --preset ci
      - name: Analyze changed C and C++ files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="HEAD^"
            fi
          fi
          sources=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && sources+=("$file")
          done < <(git diff --diff-filter=ACMR --name-only "$base" HEAD -- \
            'engine/**' 'apps/**' 'tools/**' 'tests/**' | \
            grep -E '\.(c|cc|cpp|cxx)$' || true)
          # Analyze only translation units present in the CI compile database.
          # Platform-gated sources may appear in the PR diff without a compile command.
          compiled_sources=()
          if (( ${#sources[@]} )); then
            for file in "${sources[@]}"; do
              if python3 -c 'import json, os, sys; source=os.path.realpath(sys.argv[1]); commands=json.load(open(sys.argv[2], encoding="utf-8")); raise SystemExit(0 if any(os.path.realpath(entry["file"]) == source for entry in commands) else 1)' "$file" build/ci/compile_commands.json; then
                compiled_sources+=("$file")
              fi
            done
          fi
          if (( ${#compiled_sources[@]} )); then
            "$(brew --prefix llvm@18)/bin/clang-tidy" -p build/ci \
              --extra-arg=-Wno-elaborated-enum-base \
              --warnings-as-errors='*' "${compiled_sources[@]}"
          fi
