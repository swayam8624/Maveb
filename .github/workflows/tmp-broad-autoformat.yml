name: Temporary Broad Branch Autoformat

on:
  push:
    branches:
      - research/broad-benchmark-suite-2026-09-22

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: clang-format broad benchmark')"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/broad-benchmark-suite-2026-09-22
          fetch-depth: 0
      - name: Format changed C++ files with repository LLVM
        shell: bash
        run: |
          set -euo pipefail
          FORMATTER="$(brew --prefix llvm@18)/bin/clang-format"
          "$FORMATTER" -i             engine/world_gaussian/include/aether/world_gaussian/GaussianEntityEdit.hpp             engine/world_gaussian/src/GaussianEntityEdit.cpp             tests/GaussianEntityEditTests.cpp             tests/HeadlessCBRCMultiEditToolTests.cpp             tools/maveb-cbrc-revision/main.cpp
          git diff --check
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             engine/world_gaussian/include/aether/world_gaussian/GaussianEntityEdit.hpp             engine/world_gaussian/src/GaussianEntityEdit.cpp             tests/GaussianEntityEditTests.cpp             tests/HeadlessCBRCMultiEditToolTests.cpp             tools/maveb-cbrc-revision/main.cpp
          git commit -m "chore: clang-format broad benchmark"
          git push origin HEAD:research/broad-benchmark-suite-2026-09-22
