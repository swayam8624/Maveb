name: Final Integration Autoformat

on:
  push:
    branches:
      - research/maveb-cbrc-implementation

permissions:
  contents: write

concurrency:
  group: final-integration-autoformat
  cancel-in-progress: true

jobs:
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/maveb-cbrc-implementation
      - name: Format complete integration diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          cpp_files=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && cpp_files+=("$file")
          done < <(git diff --diff-filter=ACMR --name-only origin/main...HEAD -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')
          if (( ${#cpp_files[@]} )); then
            "$(brew --prefix llvm@18)/bin/clang-format" -i "${cpp_files[@]}"
          fi

          swift_files=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && swift_files+=("$file")
          done < <(git diff --diff-filter=ACMR --name-only origin/main...HEAD -- '*.swift')
          if (( ${#swift_files[@]} )); then
            xcrun swift-format format --in-place "${swift_files[@]}"
          fi

          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Integration diff already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: normalize final integration sources"
          git push origin HEAD:research/maveb-cbrc-implementation
