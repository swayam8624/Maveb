name: Persistent World Branch Format Repair

on:
  push:
    branches:
      - feat/persistent-world-core-v1

permissions:
  contents: write

jobs:
  clang-format-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repository clang-format to changed native sources
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do
            [[ -n "$file" && -f "$file" ]] && files+=("$file")
          done < <(git diff --diff-filter=ACMR --name-only origin/main...HEAD --             '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')
          if (( ${#files[@]} )); then
            "$(brew --prefix llvm@18)/bin/clang-format" -i "${files[@]}"
          fi
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Format persistent-world research branch"
          git push origin HEAD:feat/persistent-world-core-v1
