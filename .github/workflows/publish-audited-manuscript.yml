name: Publish audited final manuscript artifacts

on:
  push:
    branches:
      - manuscript/final-consistency-audit-20260922
    paths:
      - '.github/workflows/publish-audited-manuscript.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-publishers \
            texlive-pictures \
            texlive-bibtex-extra \
            pandoc \
            poppler-utils \
            python3-docx \
            zip

      - name: Verify exact Figure 2
        run: |
          echo "e8cfa3b68930c9052c7fbe4190eb7841efb428ab1bfe587e03dbea9fac0d1f24  researchpaper/figures/figure2_exact.png" | sha256sum -c -

      - name: Build audited final artifacts
        run: |
          python3 researchpaper/build_manuscript.py --build-dir "$RUNNER_TEMP/maveb-audited-final-build"
          rm -f researchpaper/MAVEB_manuscript_package.zip
          zip -r researchpaper/MAVEB_manuscript_package.zip \
            researchpaper/main.tex \
            researchpaper/references.bib \
            researchpaper/README.md \
            researchpaper/MANUSCRIPT_QA.md \
            researchpaper/CLAIM_METHOD_CITATION_AUDIT_2026-09-22.md \
            researchpaper/REVIEW_RESPONSE_2026-09-21.md \
            researchpaper/build_manuscript.py \
            researchpaper/supplement.tex \
            researchpaper/supplement_gaussian_bound.tex \
            researchpaper/figures \
            researchpaper/MAVEB_manuscript.pdf \
            researchpaper/MAVEB_manuscript.docx \
            researchpaper/MAVEB_supplement.pdf

      - name: Commit audited final artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            researchpaper/MAVEB_manuscript.pdf \
            researchpaper/MAVEB_manuscript.docx \
            researchpaper/MAVEB_supplement.pdf \
            researchpaper/MAVEB_manuscript_package.zip
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild final manuscripts after consistency audit"
          git push origin HEAD:${GITHUB_REF_NAME}
