name: Publish final MAVEB artifacts

on:
  push:
    branches:
      - final/maveb-artifacts-2026-09-22

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-publishers \
            texlive-pictures \
            texlive-bibtex-extra \
            pandoc \
            poppler-utils \
            python3-docx \
            zip

      - name: Verify exact Figure 2 asset
        run: |
          test -f researchpaper/figures/figure2_exact.png
          echo "e8cfa3b68930c9052c7fbe4190eb7841efb428ab1bfe587e03dbea9fac0d1f24  researchpaper/figures/figure2_exact.png" | sha256sum -c -

      - name: Build final manuscript artifacts
        run: |
          python3 researchpaper/build_manuscript.py --build-dir "$RUNNER_TEMP/maveb-final-artifact-build"
          sha256sum \
            researchpaper/MAVEB_manuscript.pdf \
            researchpaper/MAVEB_manuscript.docx \
            researchpaper/MAVEB_supplement.pdf \
            > researchpaper/FINAL_MANUSCRIPT_SHA256.txt

          rm -f researchpaper/MAVEB_manuscript_package.zip
          zip -r researchpaper/MAVEB_manuscript_package.zip \
            researchpaper/main.tex \
            researchpaper/references.bib \
            researchpaper/README.md \
            researchpaper/MANUSCRIPT_QA.md \
            researchpaper/REVIEW_RESPONSE_2026-09-21.md \
            researchpaper/CLAIM_METHOD_CITATION_AUDIT_2026-09-22.md \
            researchpaper/FINAL_MANUSCRIPT_SHA256.txt \
            researchpaper/build_manuscript.py \
            researchpaper/supplement.tex \
            researchpaper/supplement_gaussian_bound.tex \
            researchpaper/figures \
            researchpaper/MAVEB_manuscript.pdf \
            researchpaper/MAVEB_manuscript.docx \
            researchpaper/MAVEB_supplement.pdf

      - name: Commit generated artifacts to publication branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-final-artifacts.yml
          git add \
            researchpaper/MAVEB_manuscript.pdf \
            researchpaper/MAVEB_manuscript.docx \
            researchpaper/MAVEB_supplement.pdf \
            researchpaper/MAVEB_manuscript_package.zip \
            researchpaper/FINAL_MANUSCRIPT_SHA256.txt
          git commit -m "paper: publish final MAVEB artifacts"
          git push origin HEAD:final/maveb-artifacts-2026-09-22
