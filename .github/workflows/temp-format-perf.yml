name: Temporary perf branch formatter

on:
  push:
    branches:
      - perf/maveb-fast-campaign

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/maveb-fast-campaign
          fetch-depth: 0
      - name: Apply repository clang-format
        shell: bash
        run: |
          set -euo pipefail
          CLANG_FORMAT="$(brew --prefix llvm@18)/bin/clang-format"
          "$CLANG_FORMAT" -i             engine/gaussian/src/ReferenceRasterizer.cpp             tools/maveb-cbrc-gaussian-oracle/main.cpp             apps/AetherBenchmark/main.cpp
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             engine/gaussian/src/ReferenceRasterizer.cpp             tools/maveb-cbrc-gaussian-oracle/main.cpp             apps/AetherBenchmark/main.cpp
          git commit -m "style: clang-format MAVEB performance changes"
          git push origin HEAD:perf/maveb-fast-campaign
