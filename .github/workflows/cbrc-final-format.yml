name: CBRC Final Format

on:
  push:
    branches:
      - research/maveb-cbrc-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/maveb-cbrc-implementation
          fetch-depth: 0

      - name: Format changed native sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/maveb-revision-criticality
          formatter="$(brew --prefix llvm@18)/bin/clang-format"
          git diff --diff-filter=ACMR --name-only origin/research/maveb-revision-criticality...HEAD -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.mm' > /tmp/cbrc-format-files.txt
          while IFS= read -r file; do
            test -n "$file" || continue
            "$formatter" -i "$file"
          done < /tmp/cbrc-format-files.txt
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: final clang-format CBRC implementation"
          git push origin HEAD:research/maveb-cbrc-implementation
