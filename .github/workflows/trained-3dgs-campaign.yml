name: Public Trained 3DGS CBRC Campaign

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/trained-3dgs-trigger
  push:
    branches:
      - run/trained-3dgs-campaign
      - research/anthony-graphics-benchmarks-2026-09-22
    paths:
      - .github/trained-3dgs-trigger

permissions:
  contents: read

jobs:
  trained-3dgs:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-maveb
          .venv-maveb/bin/python -m pip install --upgrade pip
          .venv-maveb/bin/python -m pip install numpy pillow scipy "huggingface_hub>=0.34,<2"

      - name: Run public trained-3DGS CBRC validation
        shell: bash
        env:
          MAVEB_PYTHON: ${{ github.workspace }}/.venv-maveb/bin/python
          MAVEB_TRAINED_3DGS_RESULTS_DIR: ${{ github.workspace }}/build/trained-3dgs-campaign
        run: |
          set -euo pipefail
          chmod +x run_trained_3dgs_campaign.sh
          ./run_trained_3dgs_campaign.sh

      - name: Run trained-3DGS rendered visual-quality benchmark
        shell: bash
        run: |
          set -euo pipefail
          .venv-maveb/bin/python research/analysis/cbrc_visual_quality.py \
            --campaign-dir build/trained-3dgs-campaign/campaign \
            --output-dir build/trained-3dgs-campaign/visual-quality

      - name: Publish trained visual-quality summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/trained-3dgs-campaign/visual-quality/CBRC_VISUAL_QUALITY.json ]]; then
            cat build/trained-3dgs-campaign/visual-quality/CBRC_VISUAL_QUALITY.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compact trained-3DGS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maveb-trained-3dgs-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            build/trained-3dgs-campaign/source/TRAINED_3DGS_SOURCE.json
            build/trained-3dgs-campaign/world/trained-seed.json
            build/trained-3dgs-campaign/frozen-inputs/campaign.json
            build/trained-3dgs-campaign/frozen-inputs/campaign-freeze.json
            build/trained-3dgs-campaign/campaign/campaign-rows.jsonl
            build/trained-3dgs-campaign/campaign/campaign-gates.json
            build/trained-3dgs-campaign/campaign/campaign-evaluation.json
            build/trained-3dgs-campaign/campaign/baseline-summary.json
            build/trained-3dgs-campaign/campaign/REAL_CAMPAIGN_ANSWER.*
            build/trained-3dgs-campaign/campaign/paper-artifacts/**
            build/trained-3dgs-campaign/siggraph-visuals/**
            build/trained-3dgs-campaign/visual-quality/**
            build/trained-3dgs-campaign/TRAINED_3DGS_STATUS.json
